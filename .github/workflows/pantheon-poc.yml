name: Pantheon byte repeatability
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [observe, verify, seed]
        default: observe
      scope:
        type: choice
        options: [representative, full, oracle, readiness, regressions]
        default: representative
      firestore_version:
        type: choice
        options: ['1.22.0', '1.21.0']
        default: '1.22.0'
      storage:
        type: choice
        options: [memory, disk]
        default: memory
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.scope == 'oracle' && '[1]' || '[1,2,3]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:824f1a789072e648c62541c2cfa4479c4061a290d5c27766d67dc1dcbc19b321
      options: ${{ inputs.storage == 'memory' && '--ipc=host --tmpfs /e2e-runtime:rw,exec,size=4g' || '--ipc=host' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: framework
          persist-credentials: false
      - name: Check seed scope
        env:
          MODE: ${{ inputs.mode }}
          SCOPE: ${{ inputs.scope }}
        run: test "$MODE" != seed || test "$SCOPE" = oracle
      - name: Prepare exact source without baseline images
        run: python3 framework/poc/pantheon/prepare-source.py pantheon
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Pin the selected Firestore emulator
        env:
          VERSION: ${{ inputs.firestore_version || '1.22.0' }}
        run: python3 framework/poc/pantheon/prepare-emulator.py "$VERSION" "$GITHUB_WORKSPACE/emulators"
      - name: Install and check original policy
        working-directory: pantheon
        run: |
          git config --global --add safe.directory "$PWD"
          bun install --frozen-lockfile
          bun run check:e2e-policy
          bun test tests/tooling/e2e-policy.test.ts
          uname -m
          bunx playwright --version
          df -h .
          test "$(find tests/e2e -name '*.png' | wc -l)" -eq 0
      - name: Install experimental comparison adapter
        run: python3 framework/poc/pantheon/adapter.py pantheon
      - name: Run fresh-browser comparisons
        working-directory: pantheon
        env:
          CI: 'true'
          PUBLIC_BASE_PATH: /pantheon/prtest
          E2E_POC_MODE: ${{ inputs.mode }}
          POC_SCOPE: ${{ inputs.scope }}
          E2E_RUNTIME_STORAGE: ${{ inputs.storage || 'memory' }}
          FIRESTORE_EMULATOR_VERSION: ${{ inputs.firestore_version || '1.22.0' }}
          FIREBASE_EMULATORS_PATH: ${{ github.workspace }}/emulators
        run: |
          sampler=""
          runtime="$GITHUB_WORKSPACE"
          if [[ "$E2E_RUNTIME_STORAGE" == memory ]]; then
            runtime=/e2e-runtime
            cp -a "$GITHUB_WORKSPACE/pantheon" "$GITHUB_WORKSPACE/framework" "$GITHUB_WORKSPACE/emulators" "$runtime/"
            export FIREBASE_EMULATORS_PATH="$runtime/emulators"
            mkdir -p "$runtime/browsers"
            for browser in /ms-playwright/chromium-* /ms-playwright/chromium_headless_shell-*; do
              if [[ -d "$browser" ]]; then cp -a "$browser" "$runtime/browsers/"; fi
            done
            export PLAYWRIGHT_BROWSERS_PATH="$runtime/browsers"
            export TMPDIR="$runtime/tmp" TMP="$runtime/tmp" TEMP="$runtime/tmp"
            mkdir -p "$TMPDIR"
            git config --global --add safe.directory "$runtime/pantheon"
            cd "$runtime/pantheon"
          fi
          export E2E_RUNTIME_ROOT="$runtime"
          finish() {
            if [[ -n "$sampler" ]]; then kill "$sampler" 2>/dev/null || true; fi
            if [[ "$runtime" != "$GITHUB_WORKSPACE" ]]; then
              for path in evidence pantheon/playwright-report pantheon/test-results; do
                if [[ -d "$runtime/$path" ]]; then
                  mkdir -p "$GITHUB_WORKSPACE/$(dirname "$path")"
                  cp -a "$runtime/$path" "$GITHUB_WORKSPACE/$(dirname "$path")/"
                fi
              done
            fi
          }
          trap finish EXIT
          if [[ "$POC_SCOPE" == representative ]]; then
            export E2E_STORY_FILTER='gather two players, share an invitation|enter the sanctuary, learn|Oracle draw reveals'
          elif [[ "$POC_SCOPE" == regressions ]]; then
            export E2E_STORY_FILTER='Demeter combines the costs of two offerings|tabletop (south|west|north|east) (seed-keeper|harvest-feast) stages|a worship choice opened by the scenario flies in from its sidebar card'
          elif [[ "$POC_SCOPE" == readiness ]]; then
            export E2E_STORY_FILTER='share market browsing and the complete worship scene|follow Worship and a purchase once|four shared gods and three Devotion|rules navigation remains|wait for the public market update'
          elif [[ "$POC_SCOPE" == oracle ]]; then
            export E2E_STORY_FILTER='Oracle draw reveals and lands in its sorted hand layer$'
          fi
          result=0
          repetitions="1 2 3"
          if [[ "$POC_SCOPE" == full || "$POC_SCOPE" == oracle ]]; then repetitions="1"; fi
          for repetition in $repetitions; do
            export E2E_POC_OUTPUT="$runtime/evidence/runner-${{ matrix.runner }}/repeat-$repetition"
            mkdir -p "$E2E_POC_OUTPUT"
            export JAVA_TOOL_OPTIONS="-Xlog:gc*:file=$E2E_POC_OUTPUT/java-gc-%p.log:time,uptime,tags:filecount=2,filesize=1M"
            python3 ../framework/poc/pantheon/sample-runner.py "$E2E_POC_OUTPUT/runner.jsonl" &
            sampler=$!
            bunx playwright test --list --reporter=json > "$E2E_POC_OUTPUT/collected.json"
            if ! bun run test:e2e 2>&1 | tee "$E2E_POC_OUTPUT/run.log"; then
              result=1
              tail -90 "$E2E_POC_OUTPUT/run.log"
            fi
            kill "$sampler" 2>/dev/null || true
            wait "$sampler" 2>/dev/null || true
            sampler=""
            if [[ -f firestore-debug.log ]]; then cp firestore-debug.log "$E2E_POC_OUTPUT/firestore-debug.log"; fi
            du -sh "$runtime/evidence" .git tests/e2e
            df -h .
          done
          exit "$result"
      - name: Upload all experiment results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-${{ inputs.mode }}-${{ inputs.scope }}-${{ matrix.runner }}
          path: |
            evidence/
            pantheon/playwright-report/
            pantheon/test-results/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  analyze:
    needs: capture
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pantheon-${{ inputs.mode }}-${{ inputs.scope }}-*
          merge-multiple: true
          path: downloaded
      - run: bun poc/pantheon/analyze.ts downloaded/evidence
        env:
          E2E_POC_SCOPE: ${{ inputs.scope }}
          E2E_POC_MODE: ${{ inputs.mode }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: analysis
          path: |
            downloaded/evidence/analysis.json
            downloaded/evidence/active-inventory.json
          if-no-files-found: error
